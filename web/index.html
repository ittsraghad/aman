<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>أمان — مساعد الأمن السيبراني | AMAN</title>
<meta name="description" content="AMAN: AI cybersecurity assistant grounded in MITRE ATT&CK, NVD, CISA KEV and OWASP. أمان: مساعد ذكاء اصطناعي للأمن السيبراني.">
<link rel="icon" href="/logo.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>

:root{
  --bg:#edf0f3; --surface:#ffffff; --ink:#14212e; --muted:#5a6a79; --line:#d6dde4;
  --accent:#0b6b6b; --accent-ink:#ffffff; --accent-weak:#dcefef;
  --crit:#9b1c1c; --high:#c2410c; --med:#a16207; --low:#2f7d4f; --none:#6b7785;
  --user-bg:#16324a;--user-ink:#fff;--r-sm:6px; --r-lg:12px;
  --font:"IBM Plex Sans Arabic","IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0f161d; --surface:#18222c; --ink:#e6edf3; --muted:#93a3b3; --line:#2b3947;
        --accent:#4fb3b3; --accent-ink:#06191a; --accent-weak:#16343a;--user-bg:#24506b;
        --crit:#f08080; --high:#f2a06b; --med:#e3bd5c; --low:#6cc592; --none:#93a3b3;}
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.65 var(--font);display:grid;grid-template-columns:272px 1fr;height:100vh;height:100dvh}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ---- rail ---- */
.rail{background:var(--surface);border-inline-end:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.brand{padding:18px 20px 12px;display:flex;gap:12px;align-items:center}
.logo{width:44px;height:44px;flex:none}
.logo .bg{fill:var(--accent)}.logo .fc{fill:var(--accent-ink);opacity:.14}.logo .fg{stroke:var(--accent-ink)}.logo .nd{fill:var(--accent-ink)}
.brand b{font-size:26px;font-weight:600;display:block;line-height:1.1}
.brand small{color:var(--muted);font-size:12.5px;display:block;line-height:1.35}
nav{padding:6px 12px;display:grid;gap:2px}
nav button{background:none;border:0;border-radius:var(--r-sm);padding:9px 12px;text-align:start;color:var(--muted);font-weight:500}
nav button[aria-current=page]{background:var(--accent-weak);color:var(--accent)}
nav button:hover{background:var(--bg)}
.convs{flex:1;overflow:auto;padding:10px 12px;border-top:1px solid var(--line);margin-top:8px;min-height:0}
.convs h4{margin:4px 8px 8px;font-size:13px;font-weight:500;color:var(--muted)}
.conv{display:flex;align-items:center;gap:4px;border-radius:var(--r-sm)}
.conv:hover{background:var(--bg)}
.conv button.open{flex:1;background:none;border:0;text-align:start;padding:7px 8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px}
.conv button.del{background:none;border:0;color:var(--muted);padding:4px 8px;visibility:hidden}
.conv:hover .del,.conv .del:focus-visible{visibility:visible}
.newchat{margin:0 12px;border:1px solid var(--accent);color:var(--accent);background:none;border-radius:var(--r-sm);padding:8px}
.newchat:hover{background:var(--accent-weak)}
.railfoot{padding:12px 20px;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted)}
.langbtn{background:none;border:1px solid var(--line);border-radius:var(--r-sm);padding:3px 10px}

/* ---- main ---- */
main{display:flex;flex-direction:column;min-width:0;min-height:0}
.banner{background:var(--accent-weak);color:var(--ink);padding:8px 24px;font-size:13.5px;border-bottom:1px solid var(--line)}
section.view{display:none;flex:1;min-height:0;flex-direction:column}
section.view.on{display:flex}
.scroll{flex:1;overflow:auto;padding:24px}
.col{max-width:820px;margin-inline:auto;width:100%}
h2{font-size:22px;margin:0 0 4px;font-weight:600}
.sub{color:var(--muted);margin:0 0 20px}

/* chat */
.empty{padding-top:6vh}
.empty h2{font-size:30px;line-height:1.25;max-width:20ch}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px}
.chip{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:7px 14px;font-size:14px}
.chip:hover{border-color:var(--accent);color:var(--accent)}
.msg{margin-bottom:26px}
.msg.user{background:var(--user-bg);color:var(--user-ink);border-radius:var(--r-lg);padding:10px 16px;width:fit-content;max-width:90%;margin-inline-start:auto}
.msg.bot .body{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:6px 22px 14px}
.body h3{font-size:15px;margin:16px 0 4px;font-weight:600;color:var(--accent)}
.body p{margin:4px 0}.body ul{margin:4px 0;padding-inline-start:20px}
.cite{border:0;background:var(--accent-weak);color:var(--accent);border-radius:4px;font-size:12px;padding:0 5px;margin-inline:2px;font-weight:600;vertical-align:baseline}
.meta{font-size:12.5px;color:var(--muted);margin-top:8px}
.sources{margin-top:10px;display:grid;gap:8px}
.sources>h4{margin:6px 0 0;font-size:13px;font-weight:600;color:var(--muted)}
.src{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:start;text-align:start;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:9px 12px;width:100%}
.src:hover{border-color:var(--accent)}
.src .n{background:var(--accent);color:var(--accent-ink);border-radius:4px;text-align:center;font-size:12px;font-weight:600;line-height:22px;min-width:28px;padding:0 7px;white-space:nowrap}
.src .t{font-weight:500;font-size:14px}.src .s{color:var(--muted);font-size:13px}
.src .sc{font-size:12px;color:var(--muted);white-space:nowrap}
.composer{border-top:1px solid var(--line);background:var(--surface);padding:14px 24px}
.composer form{max-width:820px;margin-inline:auto;display:flex;gap:10px}
input[type=text]{flex:1;background:var(--bg);border:1px solid var(--line);border-radius:var(--r-sm);padding:11px 14px;min-width:0}
input[type=text]:focus{outline:2px solid var(--accent);border-color:transparent}
.primary{background:var(--accent);color:var(--accent-ink);border:0;border-radius:var(--r-sm);padding:0 20px;font-weight:600}
.primary:disabled{opacity:.5;cursor:wait}
.typing{color:var(--muted)}

/* panels */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:18px 20px;margin-bottom:16px}
.panel h3{margin:0 0 10px;font-size:16px}
.row{display:flex;gap:10px}
.tag{display:inline-block;border:1px solid var(--line);border-radius:4px;padding:1px 8px;font-size:12.5px;margin:2px 4px 2px 0;color:var(--muted)}
.sev{display:inline-block;border-radius:4px;padding:1px 9px;font-size:12.5px;font-weight:600;color:#fff}
.sev.CRITICAL{background:var(--crit)}.sev.HIGH{background:var(--high)}.sev.MEDIUM{background:var(--med)}.sev.LOW{background:var(--low)}.sev.UNKNOWN{background:var(--none)}
@media (prefers-color-scheme:dark){.sev{color:#0b1218}}

/* CVE gauge: ten segments, the one memorable element */
.cvehead{display:flex;gap:22px;align-items:center;flex-wrap:wrap}
.score{font-size:64px;font-weight:600;line-height:1;font-variant-numeric:tabular-nums}
.gauge{display:grid;grid-template-columns:repeat(10,1fr);gap:3px;width:240px;margin-top:8px;direction:ltr}
.gauge i{height:10px;border-radius:2px;background:var(--line)}
.gauge i.f{background:var(--c)}
.kv{display:grid;grid-template-columns:150px 1fr;gap:6px 16px;margin-top:14px}
.kv dt{color:var(--muted)}.kv dd{margin:0;word-break:break-word}
code,.mono{white-space:nowrap;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;direction:ltr;unicode-bidi:embed}
a{color:var(--accent)}
.hit{display:block;width:100%;text-align:start;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:10px 14px;margin-bottom:8px}
.hit:hover{border-color:var(--accent)}

/* attack */
.tech{border-bottom:1px solid var(--line);padding:10px 0}
.tech summary{cursor:pointer;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.tech.sub{margin-inline-start:22px}
.tech p{margin:8px 0 4px;color:var(--ink);white-space:pre-wrap}

/* dashboard */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:14px 16px}
.tile b{font-size:28px;font-weight:600;display:block;line-height:1.2}.tile span{color:var(--muted);font-size:13.5px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.bar{display:grid;grid-template-columns:150px 1fr 34px;gap:10px;align-items:center;margin:6px 0;font-size:14px}
.bar span{overflow-wrap:anywhere;line-height:1.3}
.bar .tr{background:var(--bg);border-radius:3px;height:12px;overflow:hidden;direction:ltr}
.bar .fill{height:100%;background:var(--c,var(--accent))}
.bar b{font-weight:500;text-align:end;font-variant-numeric:tabular-nums}

/* drawer */
.drawer{position:fixed;top:0;bottom:0;inset-inline-end:0;width:min(520px,100%);background:var(--surface);border-inline-start:1px solid var(--line);box-shadow:0 0 40px rgba(0,0,0,.18);transition:transform .22s;z-index:20;display:flex;flex-direction:column}
[dir=rtl] .drawer{transform:translateX(-102%)}
[dir=ltr] .drawer{transform:translateX(102%)}
.drawer:not(.open){box-shadow:none;visibility:hidden;transition:transform .22s,visibility 0s .22s}
.drawer.open{transform:none!important}
.drawer header{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:10px}
.drawer header h3{margin:0;font-size:16px}
.drawer .content{padding:16px 20px;overflow:auto;white-space:pre-wrap}
.x{background:none;border:1px solid var(--line);border-radius:var(--r-sm);padding:2px 10px;height:30px}
.err{color:var(--crit)}
@media (max-width:760px){
  body{grid-template-columns:1fr;grid-template-rows:auto 1fr;height:100dvh}
  .rail{flex-direction:row;align-items:center;overflow:auto;border-inline-end:0;border-bottom:1px solid var(--line)}
  .brand{padding:8px 14px}.brand span,.convs,.railfoot .hint,.newchat{display:none}
  nav{display:flex;padding:0}nav button{white-space:nowrap}.railfoot{border:0;padding:0 10px}
  .scroll,.composer{padding-inline:14px}.kv{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){.drawer{transition:none}}

.pagehead{padding:18px 24px 10px;border-bottom:1px solid var(--line);background:var(--surface)}
.pagehead h1{font-size:19px;margin:0;font-weight:600}.pagehead p{margin:2px 0 0;color:var(--muted);font-size:14px}
.acts{display:flex;gap:6px;margin-top:8px}
.act{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:2px 12px;font-size:13px;color:var(--muted)}
.act:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
.act.on{background:var(--accent-weak);color:var(--accent);border-color:var(--accent)}
.act:disabled{cursor:default;opacity:.7}
.mini{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.toast{position:fixed;inset-inline-start:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:999px;font-size:13.5px;z-index:30}
.faq details{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:12px 16px;margin-bottom:10px}
.faq summary{cursor:pointer;font-weight:500}.faq p{margin:8px 0 0;color:var(--muted)}
.steps{counter-reset:s;padding:0;list-style:none}.steps li{counter-increment:s;padding-inline-start:34px;position:relative;margin:10px 0}
.steps li::before{content:counter(s);position:absolute;inset-inline-start:0;top:1px;width:24px;height:24px;border-radius:50%;background:var(--accent-weak);color:var(--accent);text-align:center;font-weight:600;font-size:13px;line-height:24px}
.fine{font-size:12.5px;color:var(--muted)}

.caret{display:inline-block;width:7px;height:1.05em;background:var(--accent);margin-inline-start:3px;vertical-align:-3px;border-radius:1px;animation:blink 1s steps(2,start) infinite}
@keyframes blink{50%{opacity:0}}
.typing::after{content:"";display:inline-block;width:1.4em;text-align:start;animation:dots 1.2s steps(4,end) infinite}
@keyframes dots{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}}
@media (prefers-reduced-motion:reduce){.caret,.typing::after{animation:none}}

</style>
</head>

/* ---------- chat ---------- */
function md(text){
  const lines=esc(text).split("\n");let html="",list="";
  const inline=s=>s.replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>").replace(/`([^`]+)`/g,"<code>$1</code>").replace(/\[(\d+(?:\s*,\s*\d+)*)\]/g,(m,g)=>g.split(",").map(n=>'<button class="cite" data-n="'+n.trim()+'">'+n.trim()+'</button>').join(""));
  const close=()=>{if(list){html+=`</${list}>`;list=""}};
  for(const l of lines){
    let m;
    if(m=l.match(/^\s*[-*•] (.+)/)){if(list!=="ul"){close();html+="<ul>";list="ul"}html+=`<li>${inline(m[1])}</li>`;continue}
    if(m=l.match(/^\s*\d+[.)] (.+)/)){if(list!=="ol"){close();html+="<ol>";list="ol"}html+=`<li>${inline(m[1])}</li>`;continue}
    close();
    if(/^#{1,4} /.test(l))html+=`<h3>${inline(l.replace(/^#+ /,""))}</h3>`;else if(l.trim())html+=`<p>${inline(l)}</p>`;
  }
  close();return html;
}
function chipsHtml(list){return list&&list.length?`<div class="mini">${list.map(s=>`<button class="chip" dir="auto">${esc(s)}</button>`).join("")}</div>`:""}
function bindChips(root){root.querySelectorAll(".chip").forEach(c=>c.onclick=()=>ask(c.textContent))}
function renderChat(){
  const box=$("#chat");box.innerHTML="";
  const hello=document.createElement("div");hello.className="msg bot";
  hello.innerHTML=`<div class="body" dir="auto">${esc(t("hello"))}</div>${cur&&cur.messages.length?"":chipsHtml(t("sugg"))}`;
  box.appendChild(hello);bindChips(hello);
  if(cur)cur.messages.forEach((m,i)=>m.role==="user"?addUser(m.content):addBot(m,i));
  scrollDown();
}
function addUser(q){const d=document.createElement("div");d.className="msg user";d.dir="auto";d.textContent=q;$("#chat").appendChild(d)}
function addBot(m,idx){
  const meta=m.meta||{},src=meta.sources||[];
  const groups=[];src.forEach(x=>{let g=groups.find(y=>y.doc_id===x.doc_id);if(!g){g={doc_id:x.doc_id,title:x.title,source:x.source,score:0,items:[]};groups.push(g)}g.items.push(x);g.score=Math.max(g.score,x.score)});
  const d=document.createElement("div");d.className="msg bot";
  const info=meta.abstained?"":(meta.mode&&meta.mode!=="canned"?`${t("confidence")} ${Math.round((meta.confidence||0)*100)}% · ${t("mode")[meta.mode]||meta.mode}`:"");
  d.innerHTML=`<div class="body" dir="auto">${md(m.content)}${chipsHtml(meta.suggestions)}</div>
    ${info?`<div class="meta">${info}</div>`:""}
    ${meta.mode==="canned"||meta.intent==="error"?"":`<div class="acts"><button class="act" data-a="copy">${t("copy")}</button>
      ${meta.intent==="security"?`<button class="act ${meta.rated==="up"?"on":""}" data-a="up" ${meta.rated?"disabled":""}>${t("up")}</button><button class="act ${meta.rated==="down"?"on":""}" data-a="down" ${meta.rated?"disabled":""}>${t("down")}</button>`:""}</div>`}
    ${src.length?`<div class="sources"><h4>${t("sources")}</h4>${groups.map(g=>`
      <button class="src"><span class="n">${g.items.map(x=>x.n).join(" · ")}</span>
        <span><span class="t">${esc(g.title)}</span><br><span class="s">${esc(g.source)}</span></span>
        <span class="sc">${t("relevance")} ${Math.round(g.score*100)}%</span></button>`).join("")}</div>`:""}`;
  d.querySelectorAll(".cite").forEach(b=>b.onclick=()=>{const s=src.find(x=>x.n==b.dataset.n);if(s)openSource(s)});
  d.querySelectorAll(".src").forEach((b,i)=>b.onclick=()=>openGroup(groups[i]));
  bindChips(d);
  const cp=d.querySelector('[data-a=copy]');if(cp)cp.onclick=async()=>{try{await navigator.clipboard.writeText(m.content);toast(t("copied"))}catch(e){}};
  d.querySelectorAll("[data-a=up],[data-a=down]").forEach(b=>b.onclick=()=>rate(idx,b.dataset.a));
  $("#chat").appendChild(d);
}
async function rate(idx,rating){
  const m=cur.messages[idx];if(!m||m.meta.rated)return;
  m.meta.rated=rating;saveChats();renderChat();toast(t("thanks"));
  try{await api("/api/feedback",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({rating,intent:m.meta.intent,mode:m.meta.mode,doc_ids:(m.meta.sources||[]).map(s=>s.doc_id)})})}catch(e){}
}
function openGroup(g){
  if(g.items.length===1)return openSource(g.items[0]);
  const f=g.items[0];     /* several passages of one document: show them together */
  openSource({...f,n:g.items.map(x=>x.n).join(", "),text:g.items.map(x=>"["+x.n+"] "+x.text).join("\n\n────────\n\n")});
}
function scrollDown(){const s=$("#chatScroll");s.scrollTop=s.scrollHeight}
function openSource(s){
  $("#dTitle").textContent=`[${s.n}] ${s.title}`;
  const link=safeUrl(s.url);
  $("#dBody").innerHTML=`<p class="sub" style="white-space:normal">${esc(s.source)} · ${esc(s.doc_id)} · ${t("section")} ${s.section+1}</p>
    ${link?`<p style="white-space:normal"><a href="${esc(link)}" target="_blank" rel="noopener noreferrer">${t("open")}</a></p>`:""}<div dir="auto"></div>`;
  $("#dBody").lastElementChild.textContent=s.text;
  $("#drawer").classList.add("open");$("#drawer").setAttribute("aria-hidden","false");$("#dClose").focus();

let busy=false;
async function ask(q){
  q=q.trim();if(!q||busy)return;
  show("chat");busy=true;$("#send").disabled=true;
  if(!cur)newChat();
  const history=cur.messages.slice(-8).map(m=>({role:m.role,content:m.content,search_query:m.meta&&m.meta.search_query,abstained:!!(m.meta&&m.meta.abstained)}));
  cur.messages.push({role:"user",content:q,meta:{}});
  if(!cur.title)cur.title=q.slice(0,60);
  cur.updated=Date.now();if(!chats.includes(cur))chats.unshift(cur);saveChats();
  $("#q").value="";renderChat();
  const ph=document.createElement("div");ph.className="msg typing";ph.textContent=t("thinking");$("#chat").appendChild(ph);scrollDown();
  const wake=setTimeout(()=>{ph.textContent=t("wake")},7000);
  let live=null,tick=null;
  try{
    const res=await fetch("/api/chat/stream",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({question:q,history})});
    if(!res.ok){let j={};try{j=await res.json()}catch(e){}throw Object.assign(new Error(j.error||res.status),{status:res.status,retry:j.retry_after})}
    let target="",shown=0,final=null,buf="";
    const reader=res.body.getReader(),dec=new TextDecoder();
    const startLive=()=>{                      /* first words arrived: swap the "thinking" line for a live bubble */
      if(live)return;clearTimeout(wake);ph.remove();
      live=document.createElement("div");live.className="msg bot";live.innerHTML='<div class="body" dir="auto"></div>';$("#chat").appendChild(live);
      tick=setInterval(()=>{                   /* smooth typing: speed grows with the backlog so we never lag behind */
        if(shown<target.length){shown+=Math.max(2,Math.ceil((target.length-shown)/25));
          const h=md(target.slice(0,shown)),c='<span class="caret"></span>';      /* keep the caret at the end of the last line */
          live.firstChild.innerHTML=/<\/(p|li|h3)>(?![\s\S]*<\/(p|li|h3)>)/.test(h)?h.replace(/(<\/(p|li|h3)>)(?![\s\S]*<\/(p|li|h3)>)/,c+"$1"):h+c;scrollDown()}
      },30)};
    for(;;){
      const {value,done}=await reader.read();if(done)break;
      buf+=dec.decode(value,{stream:true});
      let i;while((i=buf.indexOf("\n"))>=0){
        const line=buf.slice(0,i).trim();buf=buf.slice(i+1);if(!line)continue;
        let ev;try{ev=JSON.parse(line)}catch(e){continue}
        if(ev.type==="delta"){startLive();target+=ev.text}
        else if(ev.type==="replace"){startLive();target=ev.text;shown=0}
        else if(ev.type==="done")final=ev;
        else if(ev.type==="error")throw new Error("stream error");
      }
    }
    if(!final)throw new Error("incomplete stream");
    await new Promise(r=>{const w=setInterval(()=>{if(!live||shown>=target.length){clearInterval(w);r()}},30)});
    clearInterval(tick);
    cur.messages.push({role:"assistant",content:final.answer,meta:{sources:final.sources,intent:final.intent,mode:final.mode,confidence:final.confidence,search_query:final.search_query,abstained:final.abstained,suggestions:final.suggestions}});
  }catch(e){
    clearInterval(tick);
    cur.messages.push({role:"assistant",content:e.status===429?t("limit").replace("{n}",e.retry||30):t("err"),meta:{intent:"error"}});
  }
  clearTimeout(wake);saveChats();renderChat();renderConvList();
  busy=false;$("#send").disabled=false;$("#q").focus();
}
$("#form").onsubmit=e=>{e.preventDefault();ask($("#q").value)};
$("#newchat").onclick=()=>{cur=null;show("chat");renderChat();$("#q").focus()};
function renderConvList(){
  $("#convList").innerHTML=chats.map(c=>`<div class="conv"><button class="open" data-id="${esc(c.id)}" dir="auto">${esc(c.title||"…")}</button><button class="del" data-id="${esc(c.id)}" aria-label="${t("del")}">✕</button></div>`).join("");
  $("#convList").querySelectorAll(".open").forEach(b=>b.onclick=()=>{cur=chats.find(c=>c.id===b.dataset.id)||null;show("chat");renderChat()});
  $("#convList").querySelectorAll(".del").forEach(b=>b.onclick=()=>{chats=chats.filter(c=>c.id!==b.dataset.id);if(cur&&cur.id===b.dataset.id)cur=null;saveChats();renderConvList();renderChat()});

function gauge(score,sev){const n=Math.round(score||0);return `<div class="gauge" style="--c:${sevColor(sev)}">${Array.from({length:10},(_,i)=>`<i class="${i<n?"f":""}"></i>`).join("")}</div>`}
function cveCard(c){
  const link=safeUrl(c.url),k=c.kev;
  return `<div class="panel"><div class="cvehead"><div><div class="score">${c.cvss_score??"—"}</div>${gauge(c.cvss_score,c.severity)}</div>
    <div><h3 class="mono" style="font-size:22px;margin:0">${esc(c.id)}</h3><span class="sev ${esc(c.severity||"UNKNOWN")}">${esc(c.severity||"UNKNOWN")}</span>
    ${link?` <a href="${esc(link)}" target="_blank" rel="noopener noreferrer">NVD</a>`:""}</div></div>
    ${k?`<p style="margin:14px 0 0;padding:8px 12px;border-inline-start:3px solid var(--crit);background:var(--accent-weak)"><b>${t("kevT")}</b><br><span class="fine">${t("kevD")}: ${esc(k.added)} · ${t("kevDue")}: ${esc(k.due)} · ${t("kevR")}: ${esc(k.ransomware)}</span></p>`:""}
    <dl class="kv"><dt>${t("desc")}</dt><dd dir="auto">${esc(c.description)}</dd>
    <dt>${t("pub")}</dt><dd class="mono">${esc((c.published||"").slice(0,10))||"—"}</dd>
    <dt>${t("vec")}</dt><dd><code>${esc(c.vector)||"—"}</code></dd>
    <dt>${t("aff")}</dt><dd>${(c.affected||[]).map(a=>`<span class="tag">${esc(a)}</span>`).join("")||"—"}</dd>
    <dt>${t("mit")}</dt><dd dir="auto">${(c.mitigation||[]).map(esc).join("<br><br>")||"—"}</dd>
    <dt>${t("refs")}</dt><dd>${(c.references||[]).filter(safeUrl).map(r=>`<a href="${esc(r)}" target="_blank" rel="noopener noreferrer">${esc(r)}</a>`).join("<br>")||"—"}</dd></dl></div>`;
}
async function cveSearch(q){
  q=q.trim();if(!q)return;const out=$("#cveOut");
  try{
    const m=q.match(/CVE-\d{4}-\d{4,}/i);
    if(m){try{out.innerHTML=cveCard(await api("/api/cve/"+m[0].toUpperCase()))}catch(e){out.innerHTML=e.status===404?`<p class="sub">${t("notfound")}</p>`:`<p class="err">${t("err")}</p>`}return}
    const list=await api("/api/cve?q="+encodeURIComponent(q));
    out.innerHTML=list.length?list.map(c=>`<button class="hit" data-id="${esc(c.id)}"><span class="sev ${esc(c.severity||"UNKNOWN")}">${esc(c.severity||"?")}</span> <b class="mono">${esc(c.id)}</b> <span class="mono">${c.cvss_score??""}</span><div dir="auto" style="color:var(--muted);font-size:13.5px">${esc(c.summary)}…</div></button>`).join(""):`<p class="sub">${t("none")}</p>`;
    out.querySelectorAll(".hit").forEach(b=>b.onclick=()=>{$("#cveQ").value=b.dataset.id;cveSearch(b.dataset.id)});
  }catch(e){out.innerHTML=`<p class="err">${t("err")}</p>`}
}
$("#cveForm").onsubmit=e=>{e.preventDefault();cveSearch($("#cveQ").value)};

/* ---------- ATT&CK ---------- */
async function loadAttack(){
  try{
    const d=await api(`/api/attack?q=${encodeURIComponent($("#atkQ").value)}&tactic=${encodeURIComponent(tactic)}`);
    $("#atkTactics").innerHTML=[["",t("all")],...d.tactics.map(x=>[x,x])].map(([v,l])=>
      `<button class="chip" style="margin:0 0 6px 6px;${v===tactic?"border-color:var(--accent);color:var(--accent)":""}" data-t="${esc(v)}">${esc(l)}</button>`).join("");
    $("#atkTactics").querySelectorAll("button").forEach(b=>b.onclick=()=>{tactic=b.dataset.t;loadAttack()});
    $("#atkOut").innerHTML=d.techniques.length?d.techniques.slice(0,150).map(x=>`<details class="tech ${x.sub?"sub":""}"><summary><b class="mono">${esc(x.id)}</b><span>${esc(x.name)}</span>${x.tactics.map(a=>`<span class="tag">${esc(a)}</span>`).join("")}</summary><p dir="auto">${esc(x.text)}</p>${safeUrl(x.url)?`<a href="${esc(x.url)}" target="_blank" rel="noopener noreferrer">attack.mitre.org</a>`:""}</details>`).join(""):`<p class="sub">${t("none")}</p>`;
  }catch(e){$("#atkOut").innerHTML=`<p class="err">${t("err")}</p>`}
}
let atkTimer;$("#atkQ").oninput=()=>{clearTimeout(atkTimer);atkTimer=setTimeout(loadAttack,250)};

/* ---------- dashboard ---------- */
function bars(obj,color){const max=Math.max(1,...Object.values(obj));
  return Object.entries(obj).map(([k,v])=>`<div class="bar"><span>${esc(k)}</span><div class="tr"><div class="fill" style="width:${v/max*100}%;--c:${color?.(k)||"var(--accent)"}"></div></div><b>${v}</b></div>`).join("")||`<p class="sub">—</p>`}
async function loadDash(){
  try{
    const d=dash=await api("/api/dashboard");setSample(d);
    const fb=d.feedback||{up:0,down:0},tot=fb.up+fb.down;
    $("#dashOut").innerHTML=`<div class="tiles"><div class="tile"><b>${d.documents}</b><span>${t("docs")}</span></div><div class="tile"><b>${d.chunks}</b><span>${t("chunks")}</span></div>
      <div class="tile"><b>${d.kev_count||0}</b><span>${t("kevc")}</span></div><div class="tile"><b>${tot?Math.round(fb.up/tot*100)+"%":"—"}</b><span>${t("satis")}</span></div></div>
      <div class="grid2"><div class="panel"><h3>${t("severity")}</h3>${bars(d.severity,sevColor)}</div>
      <div class="panel"><h3>${t("by_source")}</h3>${bars(d.by_source)}</div>
      <div class="panel"><h3>${t("tactics")}</h3>${bars(d.tactics)}</div>
      <div class="panel"><h3>${t("latest")}</h3>${d.latest_cves.map(c=>`<div style="display:flex;gap:10px;align-items:center;margin:8px 0;flex-wrap:wrap"><span class="sev ${esc(c.severity||"UNKNOWN")}">${esc(c.severity||"?")}</span><b class="mono">${esc(c.id)}</b><span class="mono" style="color:var(--muted);margin-inline-start:auto">${esc((c.published||"").slice(0,10))}</span></div>`).join("")||"—"}</div>
      <div class="panel"><h3>${t("topics")}</h3>${d.top_topics.length?bars(Object.fromEntries(d.top_topics.map(x=>[x.title,x.count]))):`<p class="sub">${t("notopics")}</p>`}</div>
      <div class="panel"><h3>${t("system")}</h3><dl class="kv" style="grid-template-columns:100px 1fr;margin:0"><dt>Embeddings</dt><dd class="mono">${esc(d.embedder)}</dd><dt>Reranker</dt><dd class="mono">${esc(d.reranker)}</dd><dt>LLM</dt><dd class="mono">${esc(d.llm)}</dd></dl></div></div>`;
  }catch(e){$("#dashOut").innerHTML=`<p class="err">${t("err")}</p>`}
}
function setSample(d){$("#sampleBanner").hidden=!d.sample_data;$("#modeInfo").textContent=d.llm}

/* ---------- FAQ / About ---------- */
function renderFaq(){$("#faqOut").innerHTML=`<h2>${t("faqH")}</h2><br>`+t("faqItems").map(([q,a])=>`<details><summary>${esc(q)}</summary><p>${esc(a)}</p></details>`).join("")}
function renderAbout(){
  const links=[cfg.linkedin&&["LinkedIn",cfg.linkedin],cfg.github&&["GitHub",cfg.github]].filter(Boolean).filter(([,u])=>safeUrl(u));
  $("#aboutOut").innerHTML=`<h2>${t("aboutH")}</h2><p class="sub">${t("aboutP")}</p>
    <div class="panel"><h3>${t("how")}</h3><ol class="steps">${t("steps").map(s=>`<li>${esc(s)}</li>`).join("")}</ol></div>
    <div class="panel"><h3>${t("srcH")}</h3><ul>${t("srcs").map(s=>`<li>${esc(s)}</li>`).join("")}</ul></div>
    <div class="panel"><h3>${t("limH")}</h3><ul>${t("lims").map(s=>`<li>${esc(s)}</li>`).join("")}</ul></div>
    ${cfg.author?`<div class="panel"><h3>${t("author")}</h3><p style="margin:0">${esc(cfg.author)}</p><p class="fine" style="margin:6px 0 0">${links.map(([n,u])=>`<a href="${esc(u)}" target="_blank" rel="noopener noreferrer">${n}</a>`).join(" · ")}</p></div>`:""}`;
}

/* ---------- boot ---------- */
loadChats();applyLang();renderChat();
const bootWake=setTimeout(()=>toast(t("wake"),6000),2500);
api("/api/health").then(()=>clearTimeout(bootWake)).catch(()=>clearTimeout(bootWake));
api("/api/config").then(c=>{cfg=c;renderAbout()}).catch(()=>{});
api("/api/dashboard").then(setSample).catch(()=>{});
</script>
